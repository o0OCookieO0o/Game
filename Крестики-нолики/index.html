<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Крестики-нолики · результат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background-image: url('photo/1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    /* ---------- Меню ---------- */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      transition: opacity 0.4s ease;
    }
    .menu-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .menu-box {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 40px 50px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      max-width: 420px;
      width: 90%;
    }
    .menu-box h2 {
      color: #f1f5f9;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 400;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }
    .menu-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .menu-btn {
      background: #1e293b;
      border: 2px solid #334155;
      color: #f1f5f9;
      font-size: 2.8rem;
      font-weight: 700;
      width: 100px;
      height: 100px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #0f172a;
    }
    .menu-btn:hover {
      transform: translateY(-4px);
      border-color: #818cf8;
      background: #334155;
      box-shadow: 0 12px 0 #0f172a;
    }
    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0f172a;
    }
    .menu-btn.x { color: #a5b4fc; }
    .menu-btn.o { color: #7dd3fc; }

    /* ---------- Игровой контейнер ---------- */
    .game-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 750px;
      height: 100%;
      max-height: 600px;
    }

    /* ---------- Боковые счета ---------- */
    .side-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      padding: 12px 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      transition: 0.3s;
      flex-shrink: 0;
    }
    .side-score .avatar-img {
      width: clamp(2.4rem, 5vw, 3.6rem);
      height: auto;
      border-radius: 50%;
      transition: 0.3s;
      display: block;
    }
    .side-score .label {
      color: #94a3b8;
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      margin: 4px 0 2px;
    }
    .side-score .symbol {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700;
      color: #facc15;
    }
    .side-score .score-number {
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1;
      margin-top: 4px;
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    .side-score.human .symbol { color: #a5b4fc; }
    .side-score.bot .symbol { color: #7dd3fc; }
    .side-score.active {
      background: rgba(79, 70, 229, 0.25);
      border-color: #818cf8;
      box-shadow: 0 0 30px rgba(79, 70, 229, 0.3);
    }

    /* Анимация удара молнии */
    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-12deg) scale(1.1); }
      30% { transform: rotate(12deg) scale(1.1); }
      45% { transform: rotate(-10deg) scale(1.05); }
      60% { transform: rotate(10deg) scale(1.05); }
      80% { transform: rotate(-5deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes lightning {
      0% { filter: brightness(1); }
      20% { filter: brightness(2) drop-shadow(0 0 20px #ffff80); }
      40% { filter: brightness(1); }
      60% { filter: brightness(1.8) drop-shadow(0 0 30px #ffff00); }
      80% { filter: brightness(1); }
      100% { filter: brightness(1); }
    }
    .avatar-img.shake {
      animation: shake 0.6s ease-in-out 2, lightning 0.6s ease-in-out 2;
    }

    /* ---------- Игровой блок ---------- */
    .game-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 16px 20px 20px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }

    h1 {
      text-align: center;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      color: #f1f5f9;
      margin-bottom: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
      cursor: default;
    }
    h1 span {
      color: #a5b4fc;
      font-weight: 600;
    }

    .status-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 60px;
      padding: 8px 16px;
      margin: 6px 0 10px;
      flex-shrink: 0;
      min-height: 52px;
      overflow: hidden;
    }
    .status {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 500;
      color: #cbd5e1;
      text-align: center;
      transition: all 0.3s ease;
      word-break: break-word;      /* разрешаем перенос слов */
      line-height: 1.3;
    }

    /* ---------- Увеличенный статус результата (уменьшен размер) ---------- */
    .status.result-win,
    .status.result-lose,
    .status.result-draw {
      font-size: clamp(1.2rem, 2.8vw, 2rem);  /* уменьшили с 1.6rem... */
      font-weight: 700;
      animation: resultAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                 resultPulse 1.2s ease-in-out infinite alternate 0.5s;
    }
    .status.result-win { color: #a5b4fc; }
    .status.result-lose { color: #f87171; }
    .status.result-draw { color: #facc15; }

    @keyframes resultAppear {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes resultPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.06); opacity: 0.9; }
    }

    /* ---------- Остальные элементы ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 1.5vw, 14px);
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 28px;
      padding: clamp(6px, 1.5vw, 14px);
      flex-shrink: 0;
    }
    .cell {
      background: #1e293b;
      border-radius: 16px;
      box-shadow: inset 0 -4px 0 #0f172a, 0 6px 12px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 600;
      color: #f1f5f9;
      cursor: pointer;
      transition: 0.15s;
      aspect-ratio: 1 / 1;
      user-select: none;
      border: 2px solid transparent;
    }
    .cell:hover:not(.taken) {
      background: #334155;
      border-color: #818cf8;
      transform: scale(1.02);
    }
    .cell.taken {
      cursor: default;
      opacity: 0.9;
    }
    .cell.x-wins {
      background: #4f46e5;
      box-shadow: 0 0 20px #4f46e5aa;
    }
    .cell.o-wins {
      background: #0ea5e9;
      box-shadow: 0 0 20px #0ea5e9aa;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin: 8px 0 6px;
      flex-shrink: 0;
    }
    .level-group {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 10px;
      border-radius: 40px;
    }
    .level-group label {
      color: #94a3b8;
      font-size: clamp(0.7rem, 1.4vw, 0.9rem);
      padding: 4px 10px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      background: transparent;
      white-space: nowrap;
    }
    .level-group input[type="radio"] {
      display: none;
    }
    .level-group input[type="radio"]:checked + label {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 12px #4f46e580;
    }
    .level-group label:hover {
      background: #334155;
      color: #f1f5f9;
    }

    .btn {
      background: #4f46e5;
      border: none;
      color: white;
      font-weight: 600;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px #4f46e580;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .btn:hover {
      background: #6366f1;
      transform: scale(1.02);
      box-shadow: 0 8px 20px #4f46e5aa;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .reset-btn {
      background: #334155;
      box-shadow: none;
      padding: 10px 28px;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
    }
    .reset-btn:hover {
      background: #475569;
    }

    .extra-controls {
      display: flex;
      justify-content: center;
      margin: 2px 0 4px;
      flex-shrink: 0;
    }
    .change-side-btn {
      background: #0f172a;
      border: 1px solid #334155;
      box-shadow: none;
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      padding: 6px 20px;
      border-radius: 40px;
      color: #94a3b8;
      transition: 0.2s;
      cursor: pointer;
      background: transparent;
      border: 1px solid #475569;
    }
    .change-side-btn:hover {
      background: #1e293b;
      border-color: #818cf8;
      color: #f1f5f9;
      transform: scale(1.02);
    }

    .footer {
      text-align: center;
      margin-top: 6px;
      color: #94a3b8;
      font-size: clamp(0.6rem, 1.2vw, 0.8rem);
      flex-shrink: 0;
    }

    /* ---------- Адаптивность ---------- */
    @media (max-width: 650px) {
      .game-wrapper {
        flex-direction: column;
        gap: 8px;
        max-height: none;
        justify-content: center;
      }
      .side-score {
        flex-direction: row;
        gap: 12px;
        min-width: unset;
        width: 100%;
        max-width: 400px;
        padding: 6px 16px;
        justify-content: center;
        border-radius: 40px;
        background: rgba(0,0,0,0.3);
        border: none;
        backdrop-filter: blur(4px);
      }
      .side-score .score-number {
        font-size: 1.6rem;
        margin-top: 0;
      }
      .side-score .avatar-img {
        width: 2rem;
      }
      .side-score .symbol {
        font-size: 1.2rem;
      }
      .side-score .label { display: none; }
      .game-container {
        max-width: 400px;
        padding: 12px 16px 16px;
      }
      body { padding: 6px; }
      .menu-box { padding: 30px 20px; }
      .menu-btn { width: 80px; height: 80px; font-size: 2.2rem; }
      .status-panel { min-height: 44px; }
    }

    @media (max-width: 480px) {
      .board { gap: 6px; padding: 6px; }
      .cell { border-radius: 12px; }
      .status-panel { padding: 4px 12px; min-height: 40px; }
      .controls { gap: 4px; }
      .level-group { padding: 4px 6px; }
      .level-group label { padding: 3px 8px; }
      .btn { padding: 4px 14px; }
      .reset-btn { padding: 8px 20px; }
      .change-side-btn { padding: 4px 16px; font-size: 0.7rem; }
      .extra-controls { margin: 2px 0; }
    }
  </style>
</head>
<body>

  <!-- Меню выбора стороны -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-box">
      <h2>Выбери сторону</h2>
      <div class="menu-buttons">
        <button class="menu-btn x" data-side="X">✖</button>
        <button class="menu-btn o" data-side="O">◯</button>
      </div>
    </div>
  </div>

  <!-- Основная игра -->
  <div class="game-wrapper">
    <div class="side-score human" id="humanSide">
      <img src="photo/2.png" class="avatar-img" id="playerAvatar" alt="Игрок" />
      <span class="label">Вы</span>
      <span class="symbol" id="humanSymbolDisplay">X</span>
      <span class="score-number" id="humanScoreSide">0</span>
    </div>

    <div class="game-container">
      <h1><span>✖</span> Крестики-Нолики <span>◯</span></h1>

      <div class="status-panel">
        <div class="status" id="status">Выберите сторону в меню</div>
      </div>

      <div class="board" id="board"></div>

      <div class="controls">
        <div class="level-group">
          <input type="radio" name="level" id="easy" value="easy" checked />
          <label for="easy">🟢 Лёгкий</label>
          <input type="radio" name="level" id="medium" value="medium" />
          <label for="medium">🟡 Средний</label>
          <input type="radio" name="level" id="hard" value="hard" />
          <label for="hard">🔴 Сложный</label>
        </div>
        <button class="btn reset-btn" id="resetBtn">Новая игра</button>
      </div>

      <div class="extra-controls">
        <button class="change-side-btn" id="changeSideBtn">Сменить сторону</button>
      </div>

      <div class="footer">Ты играешь за <strong id="footerSymbol">X</strong> · ходи первым</div>
    </div>

    <div class="side-score bot" id="botSide">
      <img src="photo/3.png" class="avatar-img" id="botAvatar" alt="Бот" />
      <span class="label">Бот</span>
      <span class="symbol" id="botSymbolDisplay">O</span>
      <span class="score-number" id="botScoreSide">0</span>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- Элементы ----------
      const menuOverlay = document.getElementById('menuOverlay');
      const menuButtons = document.querySelectorAll('.menu-btn');
      const boardEl = document.getElementById('board');
      const statusEl = document.getElementById('status');
      const humanScoreSide = document.getElementById('humanScoreSide');
      const botScoreSide = document.getElementById('botScoreSide');
      const humanSide = document.getElementById('humanSide');
      const botSide = document.getElementById('botSide');
      const resetBtn = document.getElementById('resetBtn');
      const changeSideBtn = document.getElementById('changeSideBtn');
      const levelRadios = document.querySelectorAll('input[name="level"]');
      const playerAvatar = document.getElementById('playerAvatar');
      const humanSymbolDisplay = document.getElementById('humanSymbolDisplay');
      const botSymbolDisplay = document.getElementById('botSymbolDisplay');
      const footerSymbol = document.getElementById('footerSymbol');

      let board = Array(9).fill(null);
      let currentPlayer = 'X';
      let gameActive = true;
      let humanScore = 0;
      let botScore = 0;

      let humanSymbol = 'X';
      let botSymbol = 'O';

      // ---------- Функция для установки статуса с анимацией ----------
      function setStatus(text, resultType) {
        statusEl.textContent = text;
        statusEl.classList.remove('result-win', 'result-lose', 'result-draw');
        if (resultType) {
          statusEl.classList.add('result-' + resultType);
        }
      }

      // ---------- Старт игры ----------
      function startGame(side) {
        humanSymbol = side;
        botSymbol = (side === 'X') ? 'O' : 'X';

        humanSymbolDisplay.textContent = humanSymbol;
        botSymbolDisplay.textContent = botSymbol;
        footerSymbol.textContent = humanSymbol;

        humanScore = 0;
        botScore = 0;
        resetGame();
        menuOverlay.classList.add('hidden');
      }

      // ---------- Анимация поражения ----------
      function animatePlayerDefeat() {
        if (!playerAvatar) return;
        playerAvatar.src = 'photo/4.png';
        playerAvatar.classList.add('shake');
        setTimeout(() => {
          playerAvatar.src = 'photo/2.png';
          playerAvatar.classList.remove('shake');
        }, 2000);
      }

      function resetAvatar() {
        if (playerAvatar) {
          playerAvatar.src = 'photo/2.png';
          playerAvatar.classList.remove('shake');
        }
      }

      // ---------- Игровая логика ----------
      function checkWinner(boardArray) {
        const lines = [
          [0,1,2], [3,4,5], [6,7,8],
          [0,3,6], [1,4,7], [2,5,8],
          [0,4,8], [2,4,6]
        ];
        for (let line of lines) {
          const [a,b,c] = line;
          if (boardArray[a] && boardArray[a] === boardArray[b] && boardArray[a] === boardArray[c]) {
            return { winner: boardArray[a], line: line };
          }
        }
        if (boardArray.every(cell => cell !== null)) return { winner: 'draw', line: null };
        return { winner: null, line: null };
      }

      function getEmptyIndices(boardArray) {
        return boardArray.reduce((acc, cell, idx) => cell === null ? [...acc, idx] : acc, []);
      }

      function renderBoard() {
        boardEl.innerHTML = '';
        board.forEach((value, index) => {
          const cell = document.createElement('div');
          cell.className = 'cell' + (value ? ' taken' : '');
          cell.textContent = value || '';
          cell.dataset.index = index;
          cell.addEventListener('click', () => handleCellClick(index));
          boardEl.appendChild(cell);
        });
      }

      function highlightWinner(line) {
        if (!line) return;
        const cells = boardEl.children;
        const winner = board[line[0]];
        for (let idx of line) {
          cells[idx].classList.add(winner === 'X' ? 'x-wins' : 'o-wins');
        }
      }

      function updateUI(message, resultType) {
        humanScoreSide.textContent = humanScore;
        botScoreSide.textContent = botScore;

        const humanActive = gameActive && currentPlayer === humanSymbol;
        const botActive = gameActive && currentPlayer === botSymbol;
        humanSide.classList.toggle('active', humanActive);
        botSide.classList.toggle('active', botActive);

        if (message) {
          setStatus(message, resultType);
        } else if (!gameActive) {
          // leave
        } else {
          if (currentPlayer === humanSymbol) {
            setStatus('Ваш ход', null);
          } else {
            setStatus('Думаю... 🤔', null);
          }
        }
      }

      function handleCellClick(index) {
        if (!gameActive) return;
        if (currentPlayer !== humanSymbol) return;
        if (board[index] !== null) return;

        makeMove(index, humanSymbol);

        if (gameActive) {
          currentPlayer = botSymbol;
          updateUI();
          setTimeout(() => {
            if (gameActive && currentPlayer === botSymbol) {
              computerMove();
            }
          }, 150);
        }
      }

      function makeMove(index, player) {
        if (board[index] !== null) return false;
        board[index] = player;
        renderBoard();

        const result = checkWinner(board);
        if (result.winner) {
          gameActive = false;
          if (result.winner === humanSymbol) {
            humanScore++;
            highlightWinner(result.line);
            updateUI('Вы выиграли!', 'win');
          } else if (result.winner === botSymbol) {
            botScore++;
            highlightWinner(result.line);
            animatePlayerDefeat();
            updateUI('Компьютер выиграл!', 'lose');
          } else if (result.winner === 'draw') {
            updateUI('Ничья!', 'draw');
          }
          humanSide.classList.remove('active');
          botSide.classList.remove('active');
          return true;
        }

        if (gameActive) {
          currentPlayer = (player === humanSymbol) ? botSymbol : humanSymbol;
          updateUI();
        }
        return true;
      }

      // ---------- Ход компьютера ----------
      function computerMove() {
        if (!gameActive) return;
        if (currentPlayer !== botSymbol) return;

        const empty = getEmptyIndices(board);
        if (empty.length === 0) {
          gameActive = false;
          updateUI('Ничья!', 'draw');
          return;
        }

        const level = document.querySelector('input[name="level"]:checked').value;
        let moveIndex = -1;

        switch (level) {
          case 'easy':
            moveIndex = empty[Math.floor(Math.random() * empty.length)];
            break;
          case 'medium':
            moveIndex = getMediumMove(board, empty);
            break;
          case 'hard':
            moveIndex = getHardMove(board);
            break;
          default:
            moveIndex = empty[Math.floor(Math.random() * empty.length)];
        }

        if (moveIndex === -1 || moveIndex === undefined) {
          moveIndex = empty[Math.floor(Math.random() * empty.length)];
        }

        makeMove(moveIndex, botSymbol);

        if (gameActive && currentPlayer === humanSymbol) {
          updateUI();
        }
      }

      // ---------- Стратегии ----------
      function getMediumMove(boardArray, empty) {
        for (let idx of empty) {
          const test = [...boardArray];
          test[idx] = botSymbol;
          if (checkWinner(test).winner === botSymbol) return idx;
        }
        for (let idx of empty) {
          const test = [...boardArray];
          test[idx] = humanSymbol;
          if (checkWinner(test).winner === humanSymbol) return idx;
        }
        return empty[Math.floor(Math.random() * empty.length)];
      }

      function getHardMove(boardArray) {
        const boardCopy = [...boardArray];
        const best = minimax(boardCopy, botSymbol);
        return best.index;
      }

      function minimax(boardArray, currentPlayer) {
        const empty = getEmptyIndices(boardArray);
        const result = checkWinner(boardArray);

        if (result.winner === humanSymbol) return { score: -10 };
        if (result.winner === botSymbol) return { score: 10 };
        if (result.winner === 'draw' || empty.length === 0) return { score: 0 };

        const moves = [];
        for (let idx of empty) {
          const newBoard = [...boardArray];
          newBoard[idx] = currentPlayer;
          const nextPlayer = (currentPlayer === humanSymbol) ? botSymbol : humanSymbol;
          const resultMove = minimax(newBoard, nextPlayer);
          moves.push({ index: idx, score: resultMove.score });
        }

        let bestMove = null;
        if (currentPlayer === botSymbol) {
          let bestScore = -Infinity;
          for (let m of moves) {
            if (m.score > bestScore) {
              bestScore = m.score;
              bestMove = m;
            }
          }
        } else {
          let bestScore = Infinity;
          for (let m of moves) {
            if (m.score < bestScore) {
              bestScore = m.score;
              bestMove = m;
            }
          }
        }
        return bestMove;
      }

      // ---------- Сброс игры ----------
      function resetGame() {
        board = Array(9).fill(null);
        gameActive = true;
        if (humanSymbol === 'X') {
          currentPlayer = 'X';
        } else {
          currentPlayer = 'X';
        }
        renderBoard();
        resetAvatar();
        setStatus('Новая игра', null);
        updateUI();
        if (gameActive && currentPlayer === botSymbol) {
          setTimeout(() => {
            if (gameActive && currentPlayer === botSymbol) {
              computerMove();
            }
          }, 200);
        }
      }

      function fullResetWithMenu() {
        humanScore = 0;
        botScore = 0;
        menuOverlay.classList.remove('hidden');
        board = Array(9).fill(null);
        gameActive = false;
        renderBoard();
        humanSide.classList.remove('active');
        botSide.classList.remove('active');
        resetAvatar();
        setStatus('Выберите сторону в меню', null);
        updateUI();
      }

      // ---------- Инициализация ----------
      function init() {
        menuOverlay.classList.remove('hidden');

        menuButtons.forEach(btn => {
          btn.addEventListener('click', function() {
            const side = this.dataset.side;
            startGame(side);
          });
        });

        resetBtn.addEventListener('click', resetGame);
        changeSideBtn.addEventListener('click', fullResetWithMenu);
        document.querySelector('h1').addEventListener('dblclick', fullResetWithMenu);

        levelRadios.forEach(radio => {
          radio.addEventListener('change', resetGame);
        });

        renderBoard();
        setStatus('Выберите сторону в меню', null);
        gameActive = false;
      }

      init();
    })();
  </script>
</body>
